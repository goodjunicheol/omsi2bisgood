<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>버스 실시간 정보</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1c1f24;--sub:#6b7380;--ln:#e6e8ec;--pri:#2b6fe0;--g:#1fa34f;--y:#f0a30a;--r:#e0392f;--H:72px;--rc:#2b6fe0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit}
.scr{display:none;min-height:100vh;max-width:520px;margin:0 auto;background:var(--bg)}
.scr.on{display:block;animation:f .15s ease-out}
@keyframes f{from{opacity:0}to{opacity:1}}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--ln);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.bar{display:flex;align-items:center;gap:8px;min-height:40px}
.bar h1{font-size:18px;margin:0;flex:1}
.ib{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-left:-8px}
/* region */
.hero{padding:calc(env(safe-area-inset-top,0px) + 28px) 20px 8px;background:#fff}
.hero h1{margin:0 0 6px;font-size:24px}.hero p{margin:0 0 16px;color:var(--sub);font-size:14px}
.lbn{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#eef3fc;border-radius:10px;padding:10px 12px;font-size:13px;color:var(--sub);margin-bottom:12px}
.lbn span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbn b{color:var(--tx)}
.lbn button{flex:none;background:var(--pri);color:#fff;border-radius:8px;padding:6px 12px;font-weight:700;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px 32px}
.rg{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px 14px;text-align:left;min-height:84px}
.rg b{display:block;font-size:16px;margin-bottom:6px}.rg span{font-size:12.5px;color:var(--sub)}
.rg:active{background:#eef3fc}
/* routes */
.sb{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:0 12px;height:42px;margin-top:6px}
.sb input{flex:1;border:0;background:none;outline:0;font-size:15px;min-width:0}
.list{padding:10px 16px 32px;display:flex;flex-direction:column;gap:8px}
.rt{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;text-align:left;width:100%}
.rt:active{background:#eef3fc}
.no{font-size:21px;font-weight:800;min-width:62px}
.rt .m{flex:1;min-width:0}.rt .m small{display:block;font-size:12.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt .m b{display:block;font-size:14.5px;margin:3px 0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:60px 20px;text-align:center;color:var(--sub);font-size:14px;line-height:1.6}
.arrow{color:#aab0ba;font-size:20px}

/* ───────── 노선 화면 : 카카오버스 스타일 ───────── */
#s-map{background:#fff}
.kh{position:sticky;top:0;z-index:25;background:#fff;padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid #eceef1}
.k1{display:flex;align-items:center;gap:2px;height:54px;padding:0 6px}
.kb{width:42px;height:42px;border-radius:21px;display:flex;align-items:center;justify-content:center;flex:none}
.kb:active{background:#f1f3f5}
.kb svg{width:24px;height:24px;fill:none;stroke:#23262b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kb.fav svg{stroke:#e9a400;fill:#ffc61a}
.kt1{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding-left:2px}
.kno{font-size:23px;font-weight:800;letter-spacing:-.5px;line-height:1}
.kty{font-size:11.5px;font-weight:700;border-radius:11px;padding:3px 9px;line-height:1.2;white-space:nowrap}
.k2{padding:0 16px 10px;font-size:13px;color:#8a8f99;line-height:1.45}
.k2 b{color:#2a2d33;font-weight:600}
.kdr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 16px;border-top:1px solid #f1f2f4;font-size:14px;color:#2a2d33}
.kdr span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kdr b{font-weight:800}
.ksw{flex:none;display:flex;align-items:center;gap:5px;border:1px solid #dfe2e6;border-radius:17px;padding:6px 12px;font-size:12.5px;color:#4a4f58;background:#fff}
.ksw svg{width:15px;height:15px;fill:none;stroke:#4a4f58;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ksw:active{background:#f3f4f6}
.kdr{flex-wrap:wrap;justify-content:flex-start}
.kdb{flex:none;max-width:100%;border:1px solid #dfe2e6;border-radius:17px;padding:6px 12px;font-size:13px;color:#4a4f58;background:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kdb small{font-size:11px;color:#8a919c;margin-left:3px}
.kdb.on{background:var(--rc);border-color:var(--rc);color:#fff;font-weight:700}.kdb.on small{color:rgba(255,255,255,.8)}
.ks{display:none;margin:12px 14px 0;padding:13px 14px;border-radius:14px;border:1px solid transparent}
.ks.on{display:block}
.ks .r1{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12.5px;color:#6b7380}
.ks .r2{font-size:19px;font-weight:800;margin:5px 0 7px;line-height:1.3;word-break:keep-all}
.ks .r3{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:12.5px;color:#6b7380}
.ks .r3 b{color:#23262b;font-weight:700}
.kst{display:flex;gap:6px;align-items:center;padding:9px 16px 4px;font-size:12px;color:#8a8f99}
.kst i{display:inline-block;width:8px;height:8px;border-radius:4px;background:#c7ccd4}
.kst i.on{background:var(--g)}
.kst #upd{margin-left:8px}
.kse{display:flex;align-items:center;gap:8px;margin:6px 14px 0;padding:0 12px;height:40px;background:#f3f4f6;border-radius:10px}
.kse svg{width:17px;height:17px;fill:none;stroke:#8a8f99;stroke-width:2;stroke-linecap:round;flex:none}
.kse input{flex:1;border:0;outline:0;background:none;font-size:14.5px;min-width:0}
.map{background:#fff;padding:8px 0 150px}
.it{position:relative;height:var(--H)}
.it.last{height:62px}
.ln{position:absolute;left:89px;top:30px;width:6px;height:var(--H);background:var(--traffic,#1fa34f);border-radius:3px}
.ln.done{opacity:.28}
.dot{position:absolute;left:84px;top:22px;width:16px;height:16px;border-radius:8px;background:#fff;border:3px solid #c3c9d2;z-index:2}
.dot.end{left:81px;top:19px;width:22px;height:22px;border-radius:11px;border:4px solid #2a2d33}
.dot.done{border-color:#dde0e5}
.dot.nx{border-color:var(--r);box-shadow:0 0 0 4px rgba(224,57,47,.16)}
.sn{position:absolute;left:116px;right:84px;top:11px;border-radius:6px;transition:background .3s}
.sn b{display:block;font-size:15.5px;font-weight:600;line-height:1.32;word-break:keep-all;color:#1c1f24}
.sn span{display:block;font-size:12px;color:#9096a1;margin-top:2px}
.it.done .sn b{color:#a3a9b3;font-weight:500}
.it.nx .sn b{font-weight:800}
.it.hl .sn{background:#fff6d6}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tags:empty{display:none}
.tag{font-style:normal;font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 6px;background:#eef0f3;color:#56606e;line-height:1.35}
.tag.cu{background:var(--rc);color:#fff}
.tag.nx{background:#fdecea;color:var(--r)}
.rt2{position:absolute;right:14px;top:11px;width:70px;text-align:right}
.rt2 b{display:block;font-size:15.5px;font-weight:800;color:var(--rc);line-height:1.3}
.rt2 b.soon{color:var(--r)}
.rt2 small{display:block;font-size:11.5px;color:#9096a1;margin-top:2px}
/* 버스: 노선 색 원 + 왼쪽에 차량번호 라벨 */
.bus{position:absolute;left:80px;width:24px;height:24px;padding:0;display:block;transform:translateY(-50%);z-index:4}   /* 아이콘 중심 = 노선선(left:89px + 3px) 중심 */
.bus.stale{opacity:.5}
.bi{display:flex;width:24px;height:24px;border-radius:7px;background:var(--rc);border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35);align-items:center;justify-content:center}
.bi svg{width:18px;height:18px}
.bus:not(.stale) .bi{animation:pu 1.8s ease-out infinite}
@keyframes pu{0%{box-shadow:0 1px 5px rgba(0,0,0,.35),0 0 0 0 rgba(0,0,0,.22)}100%{box-shadow:0 1px 5px rgba(0,0,0,.35),0 0 0 10px rgba(0,0,0,0)}}
/* 차량 라벨: '1849' / '1850 저상' / '1851 저상' + 아래줄 '2층' */
.tg{font-style:normal;font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 4px;line-height:1.3;white-space:nowrap}
.kfab{position:fixed;right:max(16px,calc(50vw - 244px));bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:52px;height:52px;border-radius:26px;background:#fff;border:1px solid #dfe2e6;box-shadow:0 2px 10px rgba(0,0,0,.22);z-index:30;display:flex;align-items:center;justify-content:center}
.kfab svg{width:25px;height:25px;fill:var(--rc)}
.kfab:active{background:#f3f4f6}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.18);padding:16px 18px calc(env(safe-area-inset-bottom,0px) + 18px);z-index:40;transform:translateY(105%);transition:transform .2s ease-out}
.sheet.on{transform:none}
.sh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.sh .ttl{display:flex;align-items:center;gap:8px;min-width:0}
.sh .ttl>b{font-size:19px}
.sh button{font-size:22px;width:36px;height:36px;flex:none}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.kv div{background:#fff;padding:11px 12px}.kv .w{grid-column:span 2}
.kv span{display:block;font-size:12px;color:var(--sub);margin-bottom:3px}.kv b{font-size:15px}
.kv b.mut{color:var(--sub);font-weight:500}.kv b.cg0{color:#12a150}.kv b.cg1{color:#d98a00}.kv b.cg2{color:#e03a3a}
.note{font-size:11.5px;color:var(--sub);margin-top:8px;line-height:1.5}
.apiset{display:none;margin:-4px 0 12px;font-size:12px;color:var(--sub);line-height:1.6}
.apiset.on{display:block}
.apiset b{color:var(--tx);word-break:break-all}
.apiset button{color:var(--pri);font-weight:700;padding:2px 6px}
.apiset .w{color:var(--r)}
/* 차량 라벨: 흰 배경 + 회색 테두리 + 오른쪽 뾰족한 꼬리(버스 쪽). 2층은 아래 줄 가운데 */
.bl{position:relative;display:inline-flex;flex-direction:column;align-items:center;white-space:nowrap;background:#fff;border:1px solid #aab0ba;border-radius:5px;box-shadow:none;padding:2px 7px;margin-right:7px;color:#1c1f24;font-size:12.5px;font-weight:700;line-height:1.3;text-align:center}
.bl::before{content:"";position:absolute;right:-8px;top:50%;transform:translateY(-50%);border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:7px solid #aab0ba}
.bl::after{content:"";position:absolute;right:-6px;top:50%;transform:translateY(-50%);border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:6px solid #fff}
.bl .bl1{color:inherit}
.bl .bl2{font-size:11px;font-weight:600;color:#6b7380}
.bl .bs{font-weight:800}
.bus .bl{position:absolute;right:100%;top:50%;transform:translateY(-50%);margin:0 8px 0 0;font-size:11.5px;padding:2px 5px;max-width:70px}
.bus.sel .bl{border-color:#8a919c}
.aitg{flex:none;border:1px solid #dfe2e6;border-radius:15px;padding:4px 11px;font-size:12px;font-weight:700;background:#fff;color:#6b7380}
.aitg.on{background:#2b6fe0;border-color:#2b6fe0;color:#fff}
.aibar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px 8px;font-size:12.5px;color:var(--sub);background:#fff}
.rlist{padding:12px 16px 0}
.rl-x{display:flex;align-items:center;gap:10px;background:#fff;border:1px dashed #d3d7dd;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.rl-x .rl-no{font-size:17px;color:#6b7380}
.rl-x small{display:block;font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl-t{font-size:13px;font-weight:700;color:var(--sub);margin:0 0 6px 2px}
.rl-i{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:12px 12px;margin-bottom:8px;text-align:left}
.rl-i:active{background:#eef3fc}
.rl-no{font-size:20px;font-weight:800;min-width:58px}
.rl-m{flex:1;min-width:0}.rl-m b{display:block;font-size:14.5px}.rl-m small{display:block;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ───────── 첫 화면 (카카오버스 느낌: 회색 바탕 + 흰 둥근 카드) ───────── */
#s-region{background:#f2f4f6;min-height:100vh}
.hm-top{position:sticky;top:0;z-index:20;background:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px}
.hm-sr{display:flex;align-items:center;gap:10px;height:48px;background:#f2f4f6;border-radius:14px;padding:0 14px 0 16px}
.hm-sr input{flex:1;border:0;background:none;outline:0;font-size:16px;min-width:0;color:#191f28}
.hm-sr input::placeholder{color:#8b95a1}
.hm-sr svg{width:22px;height:22px;flex:none;fill:none;stroke:#4e5968;stroke-width:2;stroke-linecap:round}
.hm-sr .x{display:none;width:28px;height:28px;border-radius:14px;background:#d1d6db;color:#fff;font-size:14px;line-height:28px;text-align:center;flex:none}
.hm-sr.q .x{display:block}.hm-sr.q svg{display:none}
.seg{display:flex;background:#f2f4f6;border-radius:14px;padding:5px;margin-top:12px}
.seg button{flex:1;height:42px;border-radius:10px;font-size:15.5px;font-weight:700;color:#6b7684;transition:background .15s,color .15s}
.seg button.on{background:#fff;color:#191f28;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.hm-body{padding:14px 16px 48px}
.hm-tab{display:none}.hm-tab.on{display:block;animation:f .15s ease-out}
.card{display:block;width:100%;text-align:left;background:#fff;border-radius:20px;padding:18px;margin-bottom:12px}
button.card:active{background:#f9fafb}
.sec{display:flex;align-items:center;justify-content:space-between;margin:24px 6px 10px;font-size:15px;font-weight:700;color:#4e5968}
.sec:first-child{margin-top:6px}
.sec button{font-size:14px;color:#6b7684;font-weight:500;padding:4px 2px}
.pill{display:inline-flex;align-items:center;gap:5px;flex:none;font-size:12.5px;font-weight:700;border-radius:8px;padding:5px 9px;background:#f2f4f6;color:#4e5968;white-space:nowrap}
.pill.live{background:#e8f3ff;color:#1b64da}
.pill.live::before{content:"";width:6px;height:6px;border-radius:3px;background:#3182f6}
.pill.off{background:#f2f4f6;color:#8b95a1}
/* 내 버스 */
.mb-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mb-h span:first-child{font-size:15px;font-weight:700;color:#191f28}
.mb-r{display:flex;align-items:center;gap:14px}
.mb-no{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1}
.mb-r b{display:block;font-size:16px;color:#191f28;word-break:keep-all}
.mb-r small{display:block;font-size:13px;color:#8b95a1;margin-top:3px}
.mb-n{display:flex;align-items:center;gap:8px;margin-top:14px;padding:12px 14px;background:#f9fafb;border-radius:12px;font-size:14px;color:#4e5968}
.mb-n b{color:#191f28;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb-n em{font-style:normal;font-weight:800;color:#f04452;flex:none}
.mb-go{display:block;width:100%;margin-top:12px;height:46px;border-radius:12px;background:#3182f6;color:#fff;font-size:15px;font-weight:700}
.mb-go:active{background:#1b64da}
.mb-idle{display:flex;align-items:center;gap:12px;font-size:14px;color:#6b7684;line-height:1.5}
.mb-idle i{flex:none;width:40px;height:40px;border-radius:20px;background:#f2f4f6;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:20px}
/* 즐겨찾기 */
.fv{position:relative}
.fv-t{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fv-no{font-size:26px;font-weight:800;letter-spacing:-.5px}
.fv-s{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:14px;color:#6b7684;width:100%;min-width:0;overflow:hidden}
.fv-s span{white-space:nowrap;flex:none}.fv-s span+span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.fv-s i{width:1px;height:12px;background:#d1d6db;flex:none}
.fv-x{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:15px;background:#f2f4f6;color:#6b7684;font-size:14px}
.empty-c{background:#fff;border-radius:20px;padding:22px 18px;text-align:center;font-size:14px;color:#8b95a1;line-height:1.6;margin-bottom:12px}
/* 지역 바로가기 (가로 스크롤) */
.rg-sc{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.rg-sc::-webkit-scrollbar{display:none}
.rg-mini{flex:none;width:150px;background:#fff;border-radius:18px;padding:16px;text-align:left}
.rg-mini b{display:block;font-size:15.5px;color:#191f28;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rg-mini span{display:block;font-size:12.5px;color:#8b95a1;margin-top:6px}
/* 지역 카드 */
.rgc-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.rgc-h b{display:block;font-size:19px;color:#191f28;word-break:keep-all}
.rgc-h small{display:block;font-size:12.5px;color:#8b95a1;margin-top:3px;word-break:break-all}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chips i{font-style:normal;font-size:13px;font-weight:800;border-radius:8px;padding:5px 9px}
.chips i.more{background:#f2f4f6;color:#6b7684;font-weight:700}
.rgc-f{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid #f2f4f6;font-size:13.5px;color:#6b7684}
.rgc-f span:last-child{color:#3182f6;font-weight:700}
/* 검색 결과 */
.sr-i .fv-no{font-size:22px}
.sr-hit{display:block;font-size:12.5px;color:#3182f6;margin-top:6px}
/* 운행 중 탭: 기존 목록을 카드 모양으로 */
#tab-live .aibar{background:none;padding:0 6px 10px}
#tab-live .rlist{padding:0}
#tab-live .rl-t{margin:16px 6px 8px;font-size:15px;color:#4e5968}
#tab-live .rl-i,#tab-live .rl-x{border:0;border-radius:18px;padding:16px;margin-bottom:10px}
#tab-live .rl-x{background:#fafbfc;border:1px dashed #e5e8eb}
#tab-live .rl-no{font-size:22px}
#s-region .apiset{margin:0 0 12px;background:#fff;border-radius:16px;padding:12px 14px}
/* ───────── 홈: 바로가기 (길찾기 · 초정밀버스) ───────── */
.qa2{display:flex;gap:10px;padding:14px}

<script>
/* ── API 주소 설정 ─────────────────────────────────────────────────────────────
   우선순위  ① 주소창 ?api=https://xxxx.trycloudflare.com  (한 번 열면 이 브라우저에 저장되고 주소창에서는 지워짐)
            ② 화면의 [변경] 버튼으로 저장한 값
            ③ 아래 DEFAULT_API 값 (비워 두면 사용 안 함)
            ④ 모두 비어 있으면 이 페이지를 서빙한 서버(로컬 모드: http://127.0.0.1:8765) */
function normApi(v){
  v=String(v||'').trim();
  if(!v)return '';
  if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(v))v='https://'+v;
  let u;try{u=new URL(v)}catch(e){return null}
  const local=/^(localhost$|127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(u.hostname)||!u.hostname.includes('.');
  if(u.protocol!=='https:'&&!(u.protocol==='http:'&&local))return null;   // https 페이지에서는 http 주소를 브라우저가 막음
  return u.origin;                                                         // 뒤에 붙인 /api/live 같은 경로는 버림
}
/* 운영자 터널 주소를 여기에 넣으면 누구나 주소 입력 없이 바로 보입니다. 터널 주소가 바뀌면 이 한 줄만 고치세요.
   예) const DEFAULT_API = "https://abcd-efgh.trycloudflare.com";   비워 두면 주소창 ?api= 또는 [주소 입력] 버튼 사용 */
const DEFAULT_API="";
function loadApi(){
  const get=()=>{try{return localStorage.getItem('bis_api')}catch(e){return null}};
  const set=v=>{try{v?localStorage.setItem('bis_api',v):localStorage.removeItem('bis_api')}catch(e){}};
  const q=new URLSearchParams(location.search);
  if(q.has('api')){
    const n=normApi(q.get('api'));
    if(n!==null)set(n);
    try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}
  }
  return normApi(get())||normApi(DEFAULT_API)||'';
}
const API=loadApi();
function setApi(){
  const v=prompt('Python 서버의 공개 주소를 입력하세요.\n예) https://abcd-efgh.trycloudflare.com\n(비워 두고 확인하면 저장된 주소를 지웁니다)',API||'');
  if(v===null)return;
  const n=normApi(v);
  if(n===null){alert('주소 형식이 올바르지 않습니다. https:// 로 시작하는 주소여야 합니다.');return}
  try{n?localStorage.setItem('bis_api',n):localStorage.removeItem('bis_api')}catch(e){}
  location.reload();
}
/* 이 PC/같은 공유기(LAN)에서 열었으면 1초 간격, Netlify 같은 인터넷 주소면 요청 수를 줄인다 */
const REMOTE=!!API||!/^(localhost$|127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|\[?::1)/.test(location.hostname);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hash=s=>{let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
/* route_colors.json 에 색이 적힌 노선은 그 색, 아니면 번호로 정한 기본 팔레트 */
/* 노선 색: route_colors.json(서버를 켠 사람의 폴더)에 적힌 색, 지정이 없으면 파란색으로 통일 */
const routeColor=r=>/^#[0-9a-f]{6}$/i.test((r&&r.color)||'')?r.color:'#2b6fe0';
const rgbOf=c=>{const m=/^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(c||'');return m?[parseInt(m[1],16),parseInt(m[2],16),parseInt(m[3],16)]:[43,111,224]};
const rgba=(c,a)=>`rgba(${rgbOf(c).join(',')},${a})`;

let DATA=[],LIVE=null,REV=null,ERR=false,lastKey='';

const st={rg:null,rt:null,dir:0,bus:false,live:false,auto:null,sticky:null,lastBusKey:null};

async function jget(p,cache){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),REMOTE?12000:4000);
  try{
    const r=await fetch(API+p,{signal:c.signal,cache:cache||'no-store'});
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();
    const d=Date.parse(r.headers.get('Date')||'');          // 서버가 응답한 시각(이 기기의 시계가 틀려도 게시 경과시간을 맞추기 위해)
    if(j&&typeof j==='object'&&!isNaN(d))Object.defineProperty(j,'__date',{value:d,enumerable:false});
    return j;
  }finally{clearTimeout(t)}
}
/* Netlify 에는 '게시 시점의 스냅샷'이 올라가므로, 게시 후 흐른 시간만큼 도착 예정(분)과 연결 상태를 보정한다 */
function adjustStatic(j){
  if(!j||!j.static_snapshot||!j.published_at)return j;
  const el=Math.max(0,((j.__date||Date.now())-j.published_at*1000)/1000);
  j.pub_age=el;
  const mins=Math.floor(el/60);
  if(mins>0){
    const dec=v=>v==null?v:Math.max(0,v-mins);
    j.next_eta_min=dec(j.next_eta_min);
    (j.stops||[]).forEach(s=>{if(s.eta_min!=null)s.eta_min=dec(s.eta_min)});
  }
  j.age_sec=(j.age_sec||0)+el;
  if(j.connected&&el>Math.max(300,3*(j.publish_interval_sec||90))){
    j.connected=false;
    j.diag={code:'stale_publish',level:'warn',message:`PC 가 ${Math.floor(el/60)}분째 새 데이터를 올리지 않았습니다 (PC 종료/게임 중단일 수 있어요)`};
  }
  return j;
}

function show(id,push=true){
  document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id===id));
  if(push&&stack[stack.length-1]!==id)stack.push(id);
  closeSheet();window.scrollTo(0,0);
  if(id==='s-geo')requestAnimationFrame(()=>gResize());
}
function back(){if(stack.length>1){stack.pop();show(stack[stack.length-1],false)}}

/* ---------- HOF 노선 데이터 ---------- */
async function loadRoutes(){
  try{
    const j=await jget('/api/routes',REMOTE?'no-cache':'no-store');
    const keepRg=st.rg!==null&&DATA[st.rg]?DATA[st.rg].id:null,keepRt=st.rt?st.rt.id:null;
    DATA=mergeRegions(j.hofs||[]);
    st.rg=keepRg?DATA.findIndex(h=>h.id===keepRg):null;
    if(st.rg<0)st.rg=null;
    if(!st.live)st.rt=st.rg!==null&&keepRt?DATA[st.rg].routes.find(r=>r.id===keepRt)||null:null;
    if(st.rt&&st.dir>=st.rt.dirs.length)st.dir=0;
    if(!st.rt&&$('#s-map').classList.contains('on')){stack.length=1;show('s-region',false)}
    ERR=false;
  }catch(e){ERR=true}
  drawRegions();
  if(st.rg!==null&&$('#s-routes').classList.contains('on'))drawRoutes();
  if(st.rt&&$('#s-map').classList.contains('on'))drawMap();
}

/* map_names.json 에서 같은 이름을 적은 HOF 들은 한 지역으로 합친다. 같은 번호 노선은 하나로, 같은 정류장 순서의 방향은 한 번만 */
const noCmp=(a,b)=>String(a).localeCompare(String(b),'ko',{numeric:true});
function mergeRegions(hofs){
  const G=new Map();
  hofs.filter(h=>!h.error&&h.routes&&h.routes.length).forEach(h=>{
    const name=h.name_display||h.name;
    let g=G.get(name);
    if(!g){g={id:'rg:'+name,name,orig:[],routes:[],byNo:new Map()};G.set(name,g)}
    if(h.name!==name&&!g.orig.includes(h.name))g.orig.push(h.name);
    h.routes.forEach(r=>{
      let x=g.byNo.get(r.no);
      if(!x){x={id:r.id,no:r.no,dirs:[],color:r.color,color_set:r.color_set,region:name,sig:new Set()};g.byNo.set(r.no,x);g.routes.push(x)}
      (r.directions||[]).forEach(d=>{
        const sig=(d.stops||[]).map(s=>s.name).join('|');
        if(!d.stops||!d.stops.length||x.sig.has(sig))return;
        x.sig.add(sig);x.dirs.push({...d,trip_index:x.dirs.length+1});
      });
    });
  });
  return [...G.values()].map(g=>({id:g.id,name:g.name,orig:g.orig,
    routes:g.routes.filter(r=>r.dirs.length).sort((a,b)=>noCmp(a.no,b.no))})).filter(g=>g.routes.length)
    .sort((a,b)=>a.name.localeCompare(b.name,'ko'));
}
const mapOf=L=>(L&&((L.journey&&(L.journey.map_display||L.journey.map))||L.map_display||L.map))||'';

/* ---------- 첫 화면 탭 ---------- */

function liveCount(no,region){

function endsOf(r){const d=r.dirs[0],n=d.stops.length;return `${d.stops[0].display} ↔ ${d.stops[n-1].display}`}
function drawHome(){

    ||`<div class="empty-c" style="flex:1;margin:0">${ERR?'서버에 연결할 수 없습니다':'HOF 폴더에 .hof 파일을 넣어 주세요'}</div>`;

/* 즐겨찾기 키: '지역 이름|노선 번호' (예전 형식 '노선 번호' 도 인식) */
function favKey(r){return (r.region||'')+'|'+r.no}
function findFav(k){
  const i=k.indexOf('|'),rg=i>=0?k.slice(0,i):'',no=i>=0?k.slice(i+1):k;
  for(const g of DATA){if(rg&&g.name!==rg)continue;const r=g.routes.find(x=>x.no===no);if(r)return {g,r}}
  for(const g of DATA){const r=g.routes.find(x=>x.no===no);if(r)return {g,r}}

}

/* 검색: 모든 지역의 노선 번호 · 정류장 */
function onSearch(){$('#gqw').classList.toggle('q',!!$('#gq').value.trim());drawTabs();drawSearch()}

function drawSearch(){
  const q=$('#gq').value.trim().toLowerCase();if(!q)return;
  const res=[];
  DATA.forEach((g,gi)=>g.routes.forEach((r,ri)=>{
    const byNo=String(r.no).toLowerCase().includes(q);
    let hit=null;
    if(!byNo)for(const d of r.dirs){const s=d.stops.find(s=>(s.display+' '+s.name).toLowerCase().includes(q));if(s){hit=s.display;break}}
    if(byNo||hit)res.push({g,gi,r,ri,hit,rank:String(r.no).toLowerCase()===q?0:byNo?1:2});
  }));
  res.sort((a,b)=>a.rank-b.rank||noCmp(a.r.no,b.r.no));

      <div class="fv-t"><span class="fv-no" style="color:${routeColor(x.r)}">${esc(x.r.no)}</span>${liveCount(x.r.no,x.g.name)?`<span class="pill live">운행 중 ${liveCount(x.r.no,x.g.name)}대</span>`:''}</div>
      <div class="fv-s"><span>${esc(x.g.name)}</span><i></i><span>${esc(endsOf(x.r))}</span></div>
      ${x.hit?`<span class="sr-hit">정류장 · ${esc(x.hit)}</span>`:''}</button>`).join('')

}

/* 게임 AI 버스 중 노선도 위치를 못 잡은 버스: 정보만 목록으로 (노선 번호 순) */

function drawRoutes(){
  const g=DATA[st.rg];if(!g)return;
  const q=$('#q').value.trim().toLowerCase();
  const list=g.routes.filter(r=>!q||r.no.toLowerCase().includes(q)||r.dirs.some(d=>d.trip.toLowerCase().includes(q)||

  $('#routes').innerHTML=list.length?list.map(r=>{

    :'<div class="empty">검색 결과가 없습니다</div>';
}
function pickRoute(i){st.live=false;st.rt=DATA[st.rg].routes[i];pickDir(0)}

/* 다른 PC 가 보낸 운행을 같은 화면에서 그릴 수 있는 형식으로 바꾼다 */
function toLive(r){
  const stops=(r.stops||[]).map(s=>({...s,ko:s.ko||''}));

/* ---------- 내 차량 (desktop.html 에서 설정: 차량번호 뒤 4자리 / 저상 / 2층) ----------
   저상 X · 2층 X · 1849   →  1849
   저상 O · 2층 X · 1850   →  1850 저상
   저상 O · 2층 O · 1851   →  1851 저상 / (아래줄) 2층 */
function vehOf(L){
  let p=L&&L.vehicle_profile;
  if(!(p&&p.configured)){const m=L&&L.my_vehicle;   // bis_server.py 의 my_vehicle(number/double_decker) 도 인식
    p=(m&&m.configured)?{configured:true,plate:m.number,low_floor:!!m.low_floor,double_deck:!!m.double_decker}:null}
  return p&&p.configured?p:null;
}
/* ---------- 승객 정보 (서버 /api/live 의 passengers) ----------
   받지 못한 값은 숫자를 만들지 않고 '데이터 없음' / '미지원' 으로 표시한다.
   시내버스: 탑승·착석·입석 + 혼잡도 (최대 인원 설정 시 40%/70% 기준, 미설정 시 25명/45명 기준)  ·  직행좌석버스: 총 좌석 중 잔여 좌석 */
function paxRows(L){
  const P=L&&L.passengers,N=v=>v==null?'<b class="mut">데이터 없음</b>':`<b>${v}명</b>`;
  if(!P)return `<div class="w"><span>승객 정보</span><b class="mut">데이터 없음</b></div>`;
  if(P.kind==='express'){
    const head=P.seats_total==null?'총 좌석 수 미설정'
      :P.seats_left==null?`총 ${P.seats_total}석 · 잔여 데이터 없음`:`총 ${P.seats_total}석 중 잔여 ${P.seats_left}석`;
    return `<div class="w"><span>좌석 현황 (직행좌석버스)</span><b class="${P.seats_left==null?'mut':''}">${esc(head)}</b></div>
      <div><span>승차 인원</span><b class="mut">미지원</b></div><div><span>하차 인원</span><b class="mut">미지원</b></div>
      <div><span>총 좌석 수</span>${P.seats_total==null?'<b class="mut">미설정</b>':`<b>${P.seats_total}석</b>`}</div>
      <div><span>잔여 좌석 수</span>${P.seats_left==null?'<b class="mut">데이터 없음</b>':`<b>${P.seats_left}석</b>`}</div>`
      +(!P.available&&P.reason?`<div class="w"><span>안내</span><b class="mut">${esc(P.reason)}</b></div>`:'');
  }
  if(!P.available)return `<div class="w"><span>승객 정보</span><b class="mut">데이터 없음${P.reason?' · '+esc(P.reason):''}</b></div>`;
  return `<div><span>탑승 인원</span>${N(P.total)}</div><div><span>착석 인원</span>${N(P.seated)}</div>
    <div><span>입석 인원</span>${N(P.standing)}</div>
    <div><span>혼잡도</span>${P.congestion==null?'<b class="mut">데이터 없음</b>':`<b class="cg${P.congestion_level}">${esc(P.congestion)}${P.load_pct!=null?` · ${esc(P.load_pct)}%`:''}</b>`}</div>`
    +(P.capacity?`<div class="w"><span>최대 인원</span><b>${esc(P.capacity)}명</b></div>`:'');
}
function paxKey(j){const P=j&&j.passengers;return P?[P.available,P.kind,P.total,P.seated,P.standing,P.congestion,P.seats_total,P.seats_left,P.capacity,P.load_pct,P.reason]:null}
/* 말풍선: 1줄 = 차량번호 + 상태(시내버스 여유/보통/혼잡 · 직행좌석 잔여 N석), 2줄 = 저상/2층. 상태 데이터가 없으면 상태는 생략(숫자를 만들지 않음) */
const CG_COL=['#1565d8','#1a9b4b','#e0392f'];
function paxTag(L){
  const P=L&&L.passengers;if(!P||!P.available)return '';
  if(P.kind==='express')return P.seats_left==null?'':`<span class="bs" style="color:${P.seats_left===0?CG_COL[2]:CG_COL[0]}">${P.seats_left}석</span>`;
  return P.congestion==null||P.congestion_level==null?'':`<span class="bs" style="color:${CG_COL[P.congestion_level]}">${esc(P.congestion)}</span>`;
}
function busLabel(L,fallback){
  const p=vehOf(L),tag=paxTag(L);
  const l2=[p&&p.low_floor?'저상':'',p&&p.double_deck?'2층':''].filter(Boolean).join(' ');
  return `<span class="bl"><span class="bl1">${esc(p&&p.plate?p.plate:fallback)}${tag?' '+tag:''}</span>${l2?`<span class="bl2">${l2}</span>`:''}</span>`;
}
function vehText(L){const p=vehOf(L);return p?`${p.plate}${p.low_floor?' 저상':''}${p.double_deck?' 2층':''}`:''}
const BUS_SVG='<svg viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="14" rx="3" fill="none" stroke="#fff" stroke-width="2"/><path d="M5 10.5h14" stroke="#fff" stroke-width="2"/><circle cx="9" cy="14" r="1.2" fill="#fff"/><circle cx="15" cy="14" r="1.2" fill="#fff"/><path d="M8 18v2.5M16 18v2.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>';

/* ---------- 즐겨찾기 (카카오버스의 ★) ---------- */
function favs(){try{return JSON.parse(localStorage.getItem('bis_fav')||'[]')}catch(e){return[]}}
function toggleFav(){

function drawFav(){const b=$('#favBtn'),f=favs();if(b)b.classList.toggle('fav',!!st.rt&&(f.includes(favKey(st.rt))||f.includes(st.rt.no)))}

/* ---------- 실시간 운행(Journey) 노선 ---------- */
function liveRoute(){
  const L=(VIEW_REMOTE&&VIEW)?VIEW:LIVE,J=L.journey;
  return {
    id:'__live__',no:L.route||'?',live:true,color:L.color,color_set:L.color_set,region:mapOf(L),
    dirs:[{
      id:'live',
      trip:`${J.line_text||('Line '+(L.route||''))}${L.tour?' · '+L.tour+'투어':''} · ${L.trip||J.trip_label||''}`,
      destination_display:L.direction||'',
      stops:(L.stops||[]).map(s=>({name:s.resolved||s.name,display:s.display,ko:s.ko,row:s}))
    }]
  };
}

/* Journey 기준: 실제 도착/출발 시간이 기록된 마지막 정류장 = 현재, 그 다음(실제 시간 없는) 정류장 = 다음 */
function hasRealTime(s){
  if(!s)return false;
  return [s.real,s.arr_real,s.dep_real,s.arr,s.dep,s.actual_arrival,s.actual_departure].some(x=>{
    if(x===null||x===undefined)return false;
    const q=String(x).trim();
    return q!==''&&q!=='-'&&q!=='--:--:--';
  });
}
function journeyPositionOf(L){
  if(!L||!L.journey||!Array.isArray(L.stops)||!L.stops.length)return {current:null,next:null};
  let current=null;
  for(let i=0;i<L.stops.length;i++)if(hasRealTime(L.stops[i]))current=i;
  if(current===null&&Number.isInteger(L.current_index)&&L.current_index>=0)current=L.current_index;
  let next=null;
  if(current!==null){
    for(let i=current+1;i<L.stops.length;i++)if(!hasRealTime(L.stops[i])){next=i;break}
  }
  return {current,next};
}
function journeyPosition(){return journeyPositionOf(curLive())}
function stopNames(s){
  if(!s)return [];
  return [s.name,s.display,s.ko,s.resolved].filter(x=>x!==null&&x!==undefined&&String(x).trim()!=='').map(x=>String(x).trim());
}
function sameStop(a,b){
  if(!a||!b)return false;
  const A=stopNames(a),B=Array.isArray(b)?b.map(x=>String(x).trim()):[String(b).trim()];
  return A.some(x=>B.includes(x));
}
function findStopIndex(stops,value){
  if(!Array.isArray(stops)||!value)return -1;
  for(let i=0;i<stops.length;i++)if(sameStop(stops[i],value))return i;
  return -1;
}
/* 이 노선 화면에서 (한 운행의) 버스가 어디 있는지. 같은 노선 번호·같은 진행 방향일 때만 표시하고, 못 찾으면 null */
function vkey(){return VIEW_REMOTE&&VIEW&&VIEW_KEY?VIEW_KEY:'__mine__'}
function liveIdxOf(L,r,d,key){
  if(!L||!L.journey)return null;
  const stops=r.dirs[d].stops||[];
  if(r.live&&L===curLive()){const p=journeyPositionOf(L);return {current:p.current,next:p.next}}
  if(String(r.no)!==String(L.route))return null;
  const p=journeyPositionOf(L);
  let current=-1,next=-1;
  if(p.current!==null&&L.stops[p.current])current=findStopIndex(stops,stopNames(L.stops[p.current]));
  if(p.next!==null&&L.stops[p.next])next=findStopIndex(stops,stopNames(L.stops[p.next]));
  if(next<0&&current>=0&&current+1<stops.length)next=current+1;
  if(current<0&&next>0)current=next-1;
  if(current>=0&&next>=0&&next<current)return null;      // 반대 방향으로 가는 같은 노선 버스
  const sk=(st.sticky&&st.sticky.__m)?st.sticky:(st.sticky={__m:1}),k=key+'|'+r.dirs[d].id;
  if(current<0&&next<0){
    /* 잠깐 이름이 안 맞아도 20초는 직전 위치 유지 (아이콘이 깜빡 사라지지 않게) */
    if(sk[k]&&Date.now()-sk[k].t<20000)return sk[k].pos;
    return null;
  }
  const pos={current:current>=0?current:null,next:next>=0?next:null};
  sk[k]={pos,t:Date.now()};
  return pos;
}
function liveIdx(r,d){return liveIdxOf(curLive(),r,d,vkey())}
/* 멀티플레이: 이 PC 의 운행 + 호스트가 받은 다른 플레이어들의 운행 */
function allRuns(){
  const vk=vkey(),res=[];
  if(LIVE&&LIVE.journey&&(LIVE.connected||vk==='__mine__'))res.push({key:'__mine__',L:LIVE});
  RUNS.forEach(x=>res.push({key:x.run_key,L:(x.run_key===vk&&VIEW_REMOTE&&VIEW)?VIEW:toLive(x)}));
  if(VIEW_REMOTE&&VIEW&&vk!=='__mine__'&&!res.some(o=>o.key===vk))res.push({key:vk,L:VIEW});   // 목록에서 사라진 운행은 마지막 위치 유지
  return res;
}
function busesOn(r,d){
  const vk=vkey(),res=[];
  allRuns().forEach(o=>{const pos=liveIdxOf(o.L,r,d,o.key);if(pos!==null)res.push({key:o.key,L:o.L,pos,sel:o.key===vk})});
  return res;
}
function selBus(key){
  if(key==='__mine__'){VIEW=null;VIEW_KEY=null;VIEW_REMOTE=false}
  else{const r=RUNS.find(q=>q.run_key===key);if(!r)return;VIEW_KEY=key;VIEW=toLive(r);VIEW_REMOTE=true}
  st.sticky=null;drawMap();openBus();
}
/* 교통색: 서버가 traffic_color 를 주면 사용, 없으면 초록 (글자는 표시하지 않음) */
function trafficColor(s){
  const w=s?.row||s||{};
  const q=String(w.traffic_color??w.trafficColor??w.traffic??'').toLowerCase();
  if(q.includes('#f0a30a')||q.includes('yellow')||q.includes('노랑')||q.includes('서행'))return '#f0a30a';
  if(q.includes('#e0392f')||q.includes('red')||q.includes('빨강')||q.includes('정체'))return '#e0392f';
  return '#1fa34f';
}

/* ---------- 노선 화면 그리기 ---------- */
function drawMap(){
  if(st.live&&curLive()&&curLive().journey)st.rt=liveRoute();
  const r=st.rt;if(!r)return;
  const dr=r.dirs[st.dir]||r.dirs[0],stops=dr.stops||[],n=stops.length;
  const rc=routeColor(r);
  document.documentElement.style.setProperty('--rc',rc);
  /* 이 노선·방향을 달리는 모든 버스(내 PC + 다른 플레이어). 특정 한 대의 정보는 화면에 두지 않고, 버스를 누르면 그 버스의 시트가 열린다 */
  const buses=busesOn(r,st.dir),byIdx={};
  st.nbus=buses.length;
  buses.forEach(b=>{
    const p=b.pos;let i=p.current!==null?p.current:(p.next!==null?Math.max(0,p.next-1):null);
    if(i===null||i>=n||(p.current===null&&i===n-1))return;
    b.mid=!(b.L.journey.status==='at_stop'||p.next===null||p.current===null);
    (byIdx[i]=byIdx[i]||[]).push(b);
  });

  /* 헤더 */
  $('#mNo').textContent=r.no;$('#mNo').style.color=rc;
  const ty=$('#mTy');
  ty.textContent=buses.length?`운행 중 ${buses.length}대`:'노선 정보';
  ty.style.background=rgba(rc,.12);ty.style.color=rc;
  $('#mSub').innerHTML=`<b>${esc(stops[0]?stops[0].display:'')}</b> ~ <b>${esc(stops[n-1]?stops[n-1].display:'')}</b> · 정류장 ${n}개<br>${esc(dr.trip)}`;
  /* 방향(투어)이 여러 개면 전환 버튼 대신 방향마다 버튼. 도착지가 같은 방향이 있으면 번호를 붙여 구분 */
  const dn={};r.dirs.forEach(d=>{dn[d.destination_display]=(dn[d.destination_display]||0)+1});
  $('#mDir').innerHTML=r.dirs.map((d,k)=>`<button class="kdb${k===st.dir?' on':''}" onclick="setDir(${k})" title="${esc(d.trip||'')}">${esc(d.destination_display)} 방면${dn[d.destination_display]>1?`<small>${d.trip_index||k+1}</small>`:''}</button>`).join('');
  drawFav();

  /* 정류장 목록: 정류장 이름과 버스 아이콘만 (현재 위치·시간표·도착 예정 같은 한 대 기준 정보는 버스 시트에서) */
  let h='';
  stops.forEach((s,i)=>{
    const first=i===0,last=i===n-1;
    const traffic=trafficColor(stops[i+1]||s);
    const sub=`${s.ko?s.name+' · ':''}${i+1}/${n}`;
    const tags=(first?'<em class="tag">기점</em>':'')+(last?'<em class="tag">종점</em>':'');
    /* 버스 위치: 정차 중이면 정류장 위, 이동 중이면 현재~다음 정류장의 정확히 중간 */
    let bus='';
    const dup={};
    (byIdx[i]||[]).forEach(b=>{
      const k=b.mid?1:0,off=(dup[k]=(dup[k]||0)+1)-1,bc=routeColor({no:b.L.route,color:b.L.color,color_set:b.L.color_set});
      bus+=`<button class="bus${b.sel?' sel':''}${b.L.connected?'':' stale'}" style="top:calc(${b.mid?'30px + var(--H) * .5':'30px'} + ${off*42}px);--rc:${esc(bc)}" onclick="${b.sel?'openBus()':`selBus('${b.key}')`}" aria-label="버스 정보">
        ${busLabel(b.L,r.no)}<span class="bi">${BUS_SVG}</span></button>`;
    });
    h+=`<div class="it${last?' last':''}" data-i="${i}" style="--traffic:${traffic}">
      ${last?'':`<div class="ln"></div>`}
      <div class="dot${first||last?' end':''}"></div>
      <div class="sn"><b>${esc(s.display)}</b><span>${esc(sub)}</span><div class="tags">${tags}</div></div>${bus}</div>`;
  });
  $('#map').innerHTML=h;
  updStamp();
  if(st.bus)drawSheet();
}
function goBus(){const e=document.querySelector('.bus.sel')||document.querySelector('.bus');if(e)e.scrollIntoView({block:'center',behavior:'smooth'})}
function updStamp(){
  const d=new Date(),p=v=>String(v).padStart(2,'0'),n=st.nbus||0,L=LIVE;
  $('#upd').textContent=`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())} 갱신`;
  $('#lgDot').className=n?'on':'';
  $('#lgTx').textContent=n?`운행 중인 버스 ${n}대`
    :(ERR?'서버 연결 안 됨':(L&&L.diag&&L.diag.level==='error'?'로그 오류 (첫 화면 안내 참고)':'운행 중인 버스 없음'));
}
function findStop(){
  const q=$('#sq').value.trim().toLowerCase();
  document.querySelectorAll('.it').forEach(e=>e.classList.remove('hl'));
  if(!q||!st.rt)return;
  const i=st.rt.dirs[st.dir].stops.findIndex(s=>(s.display+' '+s.name).toLowerCase().includes(q));

    const e=document.querySelector(`.it[data-i="${i}"]`);

/* ---------- 버스 정보 시트 ---------- */
function openBus(){st.bus=true;drawSheet();$('#sheet').classList.add('on')}
function closeSheet(){st.bus=false;$('#sheet').classList.remove('on')}
function drawSheet(){
  const r=st.rt,L=curLive(),pos=r?liveIdx(r,st.dir):null;
  if(pos===null||!L||!L.journey){closeSheet();return}
  const J=L.journey,S=L.stops||[],n=S.length,ci=pos.current,ni=pos.next,stale=!L.connected;
  const disp=i=>(S[i]?.display||S[i]?.name||'');
  let loc;
  if(ci!==null&&J.status==='at_stop')loc=`${disp(ci)} 정차 중`;

/* ═════════════════════ 초정밀버스 지도 ═════════════════════
   openOMSI 는 지도 그림을 주지 않으므로, 서버가 모은 '차들이 다닌 자리(도로 칸)'를 흰 길로 그리고
   그 위에 정류장 · 노선 선 · 버스(내 버스 / 멀티플레이 / AI)를 실제 좌표로 올린다.
   좌표: OMSI x = 동쪽, y = 북쪽 → 화면 y 는 뒤집는다. */
const G={geo:null,live:null,ver:-1,gt:0,view:null,route:null,sel:null,hits:[],road:null,dpr:1,busy:false,ptr:new Map(),moved:false};
const stopKey=n=>String(n||'').toLowerCase().replace(/[^0-9a-zㄱ-ㆎ가-힣]/g,'');
function geoStops(){
  const m=new Map();
  ((G.geo&&G.geo.stops)||[]).forEach(s=>m.set(stopKey(s.n),s));
  return m;
}
function openGeo(r){
  G.route=r&&r.dirs?r:null;G.sel=null;G.view=null;
  $('#gCard').classList.remove('on');
  show('s-geo');
  $('#gTitle').textContent=G.route?`${G.route.no}번 초정밀버스`:'초정밀버스';
  gResize();gLoad(true);
}
async function gLoad(force){
  if(G.busy)return;G.busy=true;
  try{
    const lv=await jget('/api/map/live');G.live=lv;
    if(force||!G.geo||(lv.ver!==G.ver&&Date.now()-G.gt>60000)){   /* 도로 데이터는 커서 1분에 한 번만 다시 받음 */
      const g=await jget('/api/map/geo');
      if(!G.geo||g.ver!==G.geo.ver||g.cells.length!==G.geo.cells.length)G.road=null;
      G.geo=g;G.ver=g.ver;G.gt=Date.now();G.stopMap=geoStops();
    }
    if(!G.view)gFit();
    gDraw();
  }catch(e){
    if(!G.geo){const e2=$('#gEmpty');e2.style.display='block';e2.textContent='서버에 연결할 수 없습니다.'}
  }finally{G.busy=false}
}
function gResize(){
  const cv=$('#gcv'),w=$('#gwrap');if(!cv||!w)return;
  G.dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.max(1,Math.round(w.clientWidth*G.dpr));cv.height=Math.max(1,Math.round(w.clientHeight*G.dpr));
  gDraw();
}
window.addEventListener('resize',()=>{if($('#s-geo').classList.contains('on'))gResize()});
function gW(){return $('#gcv').width/G.dpr}
function gH(){return $('#gcv').height/G.dpr}
function w2s(x,y){const v=G.view;return [(x-v.cx)*v.k+gW()/2,gH()/2-(y-v.cy)*v.k]}
function s2w(sx,sy){const v=G.view;return [(sx-gW()/2)/v.k+v.cx,(gH()/2-sy)/v.k+v.cy]}
/* 화면에 맞추기: 노선을 보고 있으면 그 노선 정류장, 아니면 도로·정류장·버스 전체 */
function gFit(){
  const pts=[];
  const sm=G.stopMap||new Map();
  if(G.route){G.route.dirs.forEach(d=>d.stops.forEach(s=>{const p=sm.get(stopKey(s.name));if(p)pts.push([p.x,p.y])}))}
  if(!pts.length){
    (G.geo&&G.geo.stops||[]).forEach(s=>pts.push([s.x,s.y]));
    const c=(G.geo&&G.geo.cells)||[],cs=(G.geo&&G.geo.cell)||6,step=Math.max(2,Math.floor(c.length/4000)*2);
    for(let i=0;i<c.length-1;i+=step)pts.push([c[i]*cs,c[i+1]*cs]);
    const L=G.live;if(L){if(L.me)pts.push([L.me.x,L.me.y]);(L.buses||[]).forEach(b=>pts.push([b.x,b.y]))}
  }
  if(!pts.length){G.view={cx:0,cy:0,k:0.2};gDraw();return}
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  pts.forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)});
  const w=Math.max(80,x1-x0),h=Math.max(80,y1-y0);
  G.view={cx:(x0+x1)/2,cy:(y0+y1)/2,k:Math.min((gW()-60)/w,(gH()-90)/h)};
  G.view.k=Math.max(0.005,Math.min(8,G.view.k));
  gDraw();
}
function gZoom(f,sx,sy){
  if(!G.view)return;
  sx=sx==null?gW()/2:sx;sy=sy==null?gH()/2:sy;
  const [wx,wy]=s2w(sx,sy);
  G.view.k=Math.max(0.005,Math.min(12,G.view.k*f));
  const [nx,ny]=s2w(sx,sy);G.view.cx+=wx-nx;G.view.cy+=wy-ny;
  gDraw();
}
function gMe(){
  const L=G.live,m=L&&L.me;
  const b=m||(G.sel&&gFind(G.sel));
  if(!b){gToast('내 버스 위치 정보가 아직 없습니다 (게임에서 버스를 운전 중일 때 표시)');return}
  G.view.cx=b.x;G.view.cy=b.y;G.view.k=Math.max(G.view.k,1.2);gDraw();
}
function gToast(t){const c=$('#gCard');c.innerHTML=`<button class="x" onclick="gClose()">✕</button><div class="gc-s" style="margin:0;padding-right:30px">${esc(t)}</div>`;c.classList.add('on')}
function gClose(){G.sel=null;$('#gCard').classList.remove('on');gDraw()}
/* 도로 칸을 한 장의 그림(1칸=1픽셀)으로 미리 만들어 두고, 화면에는 확대·축소해서 붙인다 → 칸이 수십만 개여도 빠름 */
function gRoadRaster(){
  const g=G.geo;if(!g||!g.cells||g.cells.length<2)return null;
  const c=g.cells;let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  for(let i=0;i<c.length-1;i+=2){const x=c[i],y=c[i+1];if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  const f=Math.max(1,Math.ceil(Math.max(x1-x0+3,y1-y0+3)/4000));        // 너무 큰 맵은 줄여서
  const W=Math.ceil((x1-x0+3)/f),H=Math.ceil((y1-y0+3)/f);
  const mk=(grow,col)=>{
    const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');x.fillStyle=col;
    for(let i=0;i<c.length-1;i+=2){const px=Math.floor((c[i]-x0+1)/f),py=Math.floor((y1-c[i+1]+1)/f);x.fillRect(px-grow,py-grow,1+2*grow,1+2*grow)}
    return cv;
  };
  return {casing:mk(2,'#cfd6de'),road:mk(1,'#ffffff'),x0:(x0-1)*g.cell,y1:(y1+2)*g.cell,size:g.cell*f};
}
function gFind(key){const L=G.live;if(!L)return null;if(L.me&&L.me.key===key)return L.me;return (L.buses||[]).find(b=>b.key===key)||null}
function gDraw(){
  const cv=$('#gcv');if(!cv||!G.view||!$('#s-geo').classList.contains('on'))return;
  const x=cv.getContext('2d'),W=gW(),H=gH();
  x.setTransform(G.dpr,0,0,G.dpr,0,0);
  x.fillStyle='#e9edf1';x.fillRect(0,0,W,H);
  const g=G.geo,L=G.live||{};
  const hasRoad=g&&g.cells&&g.cells.length>1,hasStop=g&&g.stops&&g.stops.length;
  const em=$('#gEmpty');
  if(!hasRoad&&!hasStop&&!(L.me)&&!(L.buses||[]).length){
    em.style.display='block';
    em.innerHTML='아직 지도 정보가 없습니다.<br>게임에서 <b>KoreaBIS_AI.lua</b> 가 동작하면<br>차들이 다닌 길이 지도로 그려지고<br>버스가 실시간으로 올라옵니다.';
  }else em.style.display='none';
  $('#gSub').textContent=[g&&g.map_display||g&&g.map&&g.map!=='default'?(g.map_display||g.map):'',
    hasRoad?`도로 ${Math.round(g.cells.length/2).toLocaleString()}칸`:'도로 그리는 중',
    `버스 ${(L.buses||[]).filter(b=>AI_ON||b.kind!=='ai').length+(L.me?1:0)}대`].filter(Boolean).join(' · ');
  /* 도로 */
  if(hasRoad){
    if(!G.road)G.road=gRoadRaster();
    const R=G.road;
    if(R){
      const [sx,sy]=w2s(R.x0,R.y1),sc=R.size*G.view.k;
      x.imageSmoothingEnabled=true;
      x.drawImage(R.casing,sx,sy,R.casing.width*sc,R.casing.height*sc);
      x.drawImage(R.road,sx,sy,R.road.width*sc,R.road.height*sc);
    }
  }
  /* 노선 선 (노선을 보고 있을 때) */
  const sm=G.stopMap||new Map();
  if(G.route){
    const rc=routeColor(G.route);
    G.route.dirs.forEach((d,k)=>{
      x.beginPath();let on=false;
      d.stops.forEach(s=>{const p=sm.get(stopKey(s.name));if(!p)return;const [a,b]=w2s(p.x,p.y);on?x.lineTo(a,b):x.moveTo(a,b);on=true});
      x.strokeStyle=k===0?rc:rgba(rc,.45);x.lineWidth=k===0?5:4;x.lineJoin='round';x.lineCap='round';
      x.setLineDash(k===0?[]:[8,6]);x.stroke();x.setLineDash([]);
    });
  }
  /* 정류장 */
  G.hits=[];
  const rk=G.route?new Set(G.route.dirs.flatMap(d=>d.stops.map(s=>stopKey(s.name)))):null;
  const showLbl=G.view.k>0.55,boxes=[];
  ((g&&g.stops)||[]).forEach(s=>{
    const [a,b]=w2s(s.x,s.y);if(a<-20||b<-20||a>W+20||b>H+20)return;
    const mine=rk&&rk.has(stopKey(s.n));
    const r=mine?5:(G.view.k>0.3?3.5:2.5);
    x.beginPath();x.arc(a,b,r,0,7);x.fillStyle='#fff';x.fill();
    x.lineWidth=mine?2.5:1.5;x.strokeStyle=mine?routeColor(G.route):'#7b8794';x.stroke();
    G.hits.push({t:'stop',s,a,b,r:Math.max(9,r+5)});
    if(showLbl||(mine&&G.view.k>0.25)){
      const t=s.d||s.n;x.font=`${mine?700:500} 11.5px -apple-system,"Malgun Gothic",sans-serif`;
      const w=x.measureText(t).width,bx=a+7,by=b-7;
      if(!boxes.some(q=>bx<q[2]&&bx+w>q[0]&&by-11<q[3]&&by+3>q[1])){
        boxes.push([bx,by-11,bx+w,by+3]);
        x.lineWidth=3;x.strokeStyle='rgba(255,255,255,.9)';x.strokeText(t,bx,by);x.fillStyle=mine?'#191f28':'#4e5968';x.fillText(t,bx,by);
      }
    }
  });
  /* 버스 */
  const buses=(L.buses||[]).filter(b=>AI_ON||b.kind!=='ai');
  const rno=G.route&&String(G.route.no);
  const list=[...buses.map(b=>({...b,dim:rno&&String(b.line)!==rno})),...(L.me?[{...L.me,kind:'me'}]:[])];
  list.sort((p,q)=>(p.dim?0:1)-(q.dim?0:1)||(p.kind==='me')-(q.kind==='me'));
  list.forEach(b=>{
    const [a,c]=w2s(b.x,b.y);if(a<-40||c<-40||a>W+40||c>H+40)return;
    const sel=G.sel===b.key;
    const col=b.kind==='me'?'#1b2a4a':b.kind==='guest'?(/^#[0-9a-f]{6}$/i.test(b.color||'')?b.color:'#7c4dff'):(b.cg!=null?CG_COL[b.cg]:'#6b7380');
    const label=b.kind==='me'?(b.line?b.line+' 내 버스':'내 버스'):String(b.line||'?');
    x.globalAlpha=b.dim?0.35:1;
    if(b.hx!=null&&b.hy!=null){            // 진행 방향 화살표
      const dx=b.hx,dy=-b.hy,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len;
      x.beginPath();x.moveTo(a+ux*22,c+uy*22);x.lineTo(a+ux*12-uy*6,c+uy*12+ux*6);x.lineTo(a+ux*12+uy*6,c+uy*12-ux*6);x.closePath();
      x.fillStyle=col;x.fill();
    }
    x.font='800 12px -apple-system,"Malgun Gothic",sans-serif';
    const tw=x.measureText(label).width,w=tw+16,h=22;
    if(b.kind==='me'||sel){x.beginPath();x.arc(a,c,sel?20:17,0,7);x.fillStyle=rgba(col,.18);x.fill()}
    gRound(x,a-w/2,c-h/2,w,h,11);x.fillStyle=col;x.fill();x.lineWidth=sel?3:2;x.strokeStyle='#fff';x.stroke();
    x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.fillText(label,a,c+0.5);x.textAlign='left';x.textBaseline='alphabetic';
    x.globalAlpha=1;
    G.hits.push({t:'bus',b,a,c,w:w/2+4,h:h/2+4});
  });
  /* 범례 */
  $('#gLeg').innerHTML=`<span><i style="background:#1b2a4a"></i>내 버스</span><span><i style="background:#7c4dff"></i>멀티플레이</span>${AI_ON?`<span><i style="background:${CG_COL[0]}"></i>여유</span><span><i style="background:${CG_COL[1]}"></i>보통</span><span><i style="background:${CG_COL[2]}"></i>혼잡</span>`:''}`;
}
function gRound(x,l,t,w,h,r){x.beginPath();x.moveTo(l+r,t);x.arcTo(l+w,t,l+w,t+h,r);x.arcTo(l+w,t+h,l,t+h,r);x.arcTo(l,t+h,l,t,r);x.arcTo(l,t,l+w,t,r);x.closePath()}
/* 누르기: 버스 → 정보 카드, 정류장 → 지나는 노선 */
function gTap(sx,sy){
  for(let i=G.hits.length-1;i>=0;i--){
    const h=G.hits[i];
    if(h.t==='bus'&&Math.abs(sx-h.a)<=h.w&&Math.abs(sy-h.c)<=h.h){gShowBus(h.b);return}
  }
  for(let i=G.hits.length-1;i>=0;i--){
    const h=G.hits[i];
    if(h.t==='stop'&&Math.hypot(sx-h.a,sy-h.b)<=h.r){gShowStop(h.s);return}
  }
  gClose();
}
function gShowBus(b){

/* ── 시간 추정 ── */
function wyXY(name){const sm=G.stopMap;return sm?sm.get(stopKey(name))||null:null}
function wySeg(d,i){

/* ── 경로 찾기 ── */
/* ── 경로 찾기: 갈아타는 횟수 제한 없음 (RAPTOR 방식) ──
   1회차 = 버스 1대로 갈 수 있는 정류장, 2회차 = 2대로 …  더 빨리 갈 수 있는 정류장이 없을 때까지 넓혀 간다.
   갈아탈 때: 같은 정류장(반대편 포함) 또는 300m 안 정류장으로 걸어서, 갈아타는 데 1분을 더한다. */
const WY_XFER=60,WY_MAXK=12;
function wyNet(R){
  /* 지역별 노선 방향 목록과 '걸어서 갈아탈 수 있는 정류장' 표 (좌표가 바뀌면 다시 만듦) */
  const key=DATA.indexOf(R)+'|'+(G.geo?G.geo.ver:'-');
  if(W.net&&W.net.key===key&&W.net.R===R)return W.net;
  const dirs=[];R.routes.forEach((r,ri)=>r.dirs.forEach((d,k)=>dirs.push({r,ri,k,d})));
  const byStop=new Map();
  dirs.forEach(x=>x.d.stops.forEach((s,i)=>{(byStop.get(s.name)||byStop.set(s.name,[]).get(s.name)).push({x,i})}));
  const names=[...byStop.keys()],gk=n=>stopKey(baseName(n)),byG=new Map();
  names.forEach(n=>{(byG.get(gk(n))||byG.set(gk(n),[]).get(gk(n))).push(n)});
  const foot=new Map();
  names.forEach(n=>{
    const out=[],a=wyXY(n);
    (byG.get(gk(n))||[]).forEach(m=>{if(m===n)return;const b=wyXY(m);out.push({m,dist:a&&b?Math.min(300,Math.hypot(a.x-b.x,a.y-b.y)):30})});
    if(a)names.forEach(m=>{if(m===n||gk(m)===gk(n))return;const b=wyXY(m);if(b){const dd=Math.hypot(a.x-b.x,a.y-b.y);if(dd<=300)out.push({m,dist:dd})}});
    foot.set(n,out);
  });

}
function wyRaptor(net,O,D,ban){
  const INF=1e15,best=new Map(),L=[new Map()],RL=[new Map()];   /* L: 정류장별 가장 빠른 기록, RL: 그중 버스로 도착한 기록 */
  const bestOf=n=>best.has(n)?best.get(n):INF;
  let marked=new Set();
  O.forEach(n=>{if(!net.byStop.has(n))return;L[0].set(n,{t:0,via:'start'});best.set(n,0);marked.add(n)});
  const destBest=()=>{let m=INF;D.forEach(n=>{m=Math.min(m,bestOf(n))});return m};
  for(let k=1;k<=WY_MAXK&&marked.size;k++){
    const prev=L[k-1],cur=new Map(),rides=new Map(),newly=new Set();L.push(cur);RL.push(rides);
    /* 이번 회차에 탈 수 있는 노선 방향과, 그 방향에서 가장 앞에서 탈 수 있는 정류장 */
    const q=new Map();
    marked.forEach(n=>(net.byStop.get(n)||[]).forEach(({x,i})=>{if(ban&&ban.has(x.r))return;const v=q.get(x);if(v==null||i<v)q.set(x,i)}));
    const cap=destBest();
    q.forEach((i0,x)=>{
      const st=x.d.stops;let bi=-1,tb=0;
      for(let i=i0;i<st.length;i++){
        const n=st[i].name;
        if(bi>=0){
          tb+=wySeg(x.d,i-1);
          if(tb<bestOf(n)&&tb<cap){const lb={t:tb,via:'ride',x,bi,i};cur.set(n,lb);rides.set(n,lb);best.set(n,tb);newly.add(n)}
        }
        const pl=prev.get(n);
        if(pl){const tt=pl.t+(k>1?WY_XFER:0);if(bi<0||tt<tb){bi=i;tb=tt}}
      }
    });
    /* 내려서 걸어갈 수 있는 정류장 */
    const walked=new Set();
    newly.forEach(n=>{
      const lb=rides.get(n);
      (net.foot.get(n)||[]).forEach(({m,dist})=>{
        const tt=lb.t+dist/1.2;
        if(tt<bestOf(m)&&tt<cap){cur.set(m,{t:tt,via:'walk',from:n,dist});best.set(m,tt);walked.add(m)}
      });
    });
    marked=new Set([...newly,...walked]);
  }
  /* 회차마다 도착 정류장에 더 빨리 닿았으면 그 경로 하나 (= 환승 횟수별로 가장 빠른 경로) */

  }

}
function wyBack(L,RL,k,n){
  /* 도착 정류장에서 거꾸로: 버스 구간 ← (걸어서 갈아타기) ← 버스 구간 … ← 출발 */
  const legs=[],walks=[];let tail=null,pend=null,needRide=false;
  while(k>0){
    let lb=needRide?RL[k].get(n):L[k].get(n);needRide=false;
    if(!lb)return null;
    if(lb.via==='walk'){pend={m:Math.round(lb.dist),sec:lb.dist/1.2};n=lb.from;lb=RL[k].get(n);if(!lb)return null}
    if(lb.via!=='ride')return null;
    if(pend){if(!legs.length)tail=pend;else walks.unshift(pend);pend=null}
    else if(legs.length)walks.unshift({m:0,sec:0});
    legs.unshift({...lb.x,from:lb.bi,to:lb.i,sec:wyRide(lb.x.d,lb.bi,lb.i)});
    n=lb.x.d.stops[lb.bi].name;k--;
    const pl=L[k].get(n);
    if(pl&&pl.via==='walk'&&k>0){pend={m:Math.round(pl.dist),sec:pl.dist/1.2};n=pl.from;needRide=true}
  }
  while(walks.length>legs.length-1)walks.shift();
  while(walks.length<legs.length-1)walks.push({m:0,sec:0});
  const total=legs.reduce((a,l)=>a+l.sec,0)+walks.reduce((a,w)=>a+w.sec+WY_XFER,0)+(tail?tail.sec:0);
  return {legs,walks,tail,total,xfer:legs.length-1};
}
function wySearch(){
  W.sel=null;$('#wyR').classList.remove('on');
  const o=W.o,d=W.d;

  if(o.key===d.key){W.res=[];$('#wyList').innerHTML='<div class="wy-empty">출발지와 도착지가 같습니다.</div>';wyDrawTabs();return}
  if(o.gi!==d.gi){W.res=[];$('#wyList').innerHTML=`<div class="wy-empty">출발지(${esc(o.region)})와 도착지(${esc(d.region)})가 다른 지역입니다.</div>`;wyDrawTabs();return}
  const net=wyNet(DATA[o.gi]),found=new Map();
  const add=c=>{const id=c.legs.map(l=>l.r.no+'#'+l.k+'@'+l.from+'-'+l.to).join('>');if(!found.has(id))found.set(id,c)};
  const base=wyRaptor(net,o.names,d.names,null);base.forEach(add);
  /* 다른 경로도 보여 주기: 찾은 경로에 쓰인 노선을 하나씩 빼고 다시 찾음 (2단계까지) */
  const tried=new Set();let runs=0;
  const explore=(list,depth,ban)=>{
    list.forEach(c=>c.legs.forEach(l=>{
      if(runs>=40)return;
      const b2=new Set(ban);b2.add(l.r);const sig=[...b2].map(r=>r.no).sort().join(',');
      if(tried.has(sig))return;tried.add(sig);runs++;
      const more=wyRaptor(net,o.names,d.names,b2);more.forEach(add);
      if(depth<2)explore(more,depth+1,b2);
    }));
  };

/* ── 실시간 도착: 이 노선을 달리는 버스가 승차 정류장까지 ── */
function wyArr(leg){
  const out=[];
  busesOn(leg.r,leg.k).forEach(b=>{
    const p=b.pos,at=p.current!=null?p.current:(p.next!=null?p.next-1:null);
    if(at==null)return;
    const away=leg.from-at;if(away<0)return;
    let m=null;
    const row=(b.L.stops||[]).find(s=>s.name===leg.d.stops[leg.from].name&&s.eta_min!=null);
    if(row)m=row.eta_min;else m=Math.round(wyRide(leg.d,Math.max(0,at),leg.from)/60);
    if(away===0&&b.L.journey&&b.L.journey.status==='at_stop')m=0;
    out.push({no:leg.r.no,m,away,key:b.key});
  });

const wyClock=t=>new Date(t).toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'});
const wyMin=s=>Math.max(1,Math.round(s/60));
function wyPlan(c){
  /* 시간표: 출발(지금) → 첫 버스 대기(실시간 도착을 알면) → 탑승 → (환승 도보 → 다음 버스) → 도착 */
  const now=Date.now(),a0=wyArr(c.legs[0]),wait0=a0.length&&a0[0].m!=null?a0[0].m*60:0;
  let t=now+wait0*1000;const steps=[];
  c.legs.forEach((l,i)=>{
    const st=t;t+=l.sec*1000;steps.push({l,st,en:t});
    if(c.walks[i]){t+=(c.walks[i].sec+60)*1000}
  });
  if(c.tail)t+=c.tail.sec*1000;
  return {now,wait0,arrive:t,steps,arr0:a0};
}
function wyFiltered(){
  let r=W.res.filter(c=>W.tab==='all'||(W.tab==='direct'?c.xfer===0:c.xfer>0));
  const key=W.sort==='time'?(c=>c.total):W.sort==='xfer'?(c=>c.xfer*1e6+c.total):(c=>c.total+c.xfer*300);
  return r.slice().sort((a,b)=>key(a)-key(b));
}
function wyDrawTabs(){
  const n0=W.res.length,n1=W.res.filter(c=>!c.xfer).length,n2=n0-n1;
  $('#wyTabs').innerHTML=n0?[['all','전체',n0],['direct','바로 가기',n1],['xfer','환승',n2]].map(([k,l,n])=>`<button class="${W.tab===k?'on':''}" ${n?'':'disabled'} onclick="W.tab='${k}';wyDraw()">${l} ${n}</button>`).join(''):'';
  $('#wyOpt').style.display=n0?'flex':'none';
  $('#wyNow').innerHTML=`오늘 <b>${esc(wyClock(Date.now()))}</b> 출발`;
}
function wyBar(c,plan){
  const segs=[];
  if(plan.wait0>0)segs.push({t:'walk',sec:plan.wait0,lbl:wyMin(plan.wait0)+'분'});
  c.legs.forEach((l,i)=>{segs.push({t:'bus',sec:l.sec,lbl:wyMin(l.sec)+'분',col:routeColor(l.r)});if(c.walks[i])segs.push({t:'walk',sec:c.walks[i].sec+60,lbl:wyMin(c.walks[i].sec+60)+'분'})});
  if(c.tail)segs.push({t:'walk',sec:c.tail.sec,lbl:wyMin(c.tail.sec)+'분'});
  const tot=segs.reduce((a,s)=>a+s.sec,0)||1;
  return `<div class="wbar">${segs.map(s=>`<div class="wseg w${s.t}" style="flex:${(s.sec/tot).toFixed(3)} 1 0;${s.t==='bus'?'background:'+s.col:''}">${esc(s.lbl)}</div>`).join('')}</div>`;
}
const BUS_IC='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12a2 2 0 0 1 2 2v10a2 2 0 0 1-1 1.7V19a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H8v1a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-2.3A2 2 0 0 1 4 15V5a2 2 0 0 1 2-2zm0 3v5h12V6H6zm1.5 7.5a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zm9 0a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z"/></svg>';
function wyArrHtml(arr,leg){
  if(!arr.length)return `<div class="wa wa-none">${BUS_IC.replace('<svg','<svg style="width:13px;height:13px"')} ${esc(leg.r.no)} 도착 정보 없음</div>`;
  return arr.map(a=>`<div class="wa"><span class="wa-no" style="color:${routeColor(leg.r)}">${esc(a.no)}</span><span class="wa-m">${a.m<=0?'곧 도착':a.m+'분'}</span><span class="wa-s">${a.away?a.away+'정류장':'도착'}</span></div>`).join('');
}
function wyDraw(){
  wyDrawTabs();
  if(!W.res.length){
    if(W.o&&W.d&&W.at)$('#wyList').innerHTML='<div class="wy-empty">이 두 정류장을 잇는 버스 경로를 찾지 못했습니다.<br>(몇 번을 갈아타도 닿지 않는 경우입니다)</div>';
    return;
  }
  const L=wyFiltered();
  const fastest=Math.min(...W.res.map(c=>c.total));
  W.view=L;
  $('#wyList').innerHTML=L.map((c,i)=>{
    const p=wyPlan(c);
    const tag=i===0&&W.sort==='best'?'최적':c.total===fastest?'최소시간':(c.xfer===0?'바로 가기':'');
    const rows=c.legs.map((l,j)=>{
      const arr=j===0?p.arr0:wyArr(l);
      return `<div class="wl"><div class="wl-k" style="color:${routeColor(l.r)}">${BUS_IC}${esc(l.r.no)}</div>
        <div class="wl-v"><b>${esc(l.d.stops[l.from].display)}</b>${wyArrHtml(arr,l)}</div></div>`
        +(c.walks[j]&&c.legs[j+1]?`<div class="wl"><div class="wl-k off">환승</div><div class="wl-v"><b>${esc(l.d.stops[l.to].display)}${l.d.stops[l.to].name!==c.legs[j+1].d.stops[c.legs[j+1].from].name?' → '+esc(c.legs[j+1].d.stops[c.legs[j+1].from].display):''}</b>${c.walks[j].m?`<span class="wa wa-s">도보 ${c.walks[j].m}m</span>`:''}</div></div>`:'');
    }).join('');
    const lst=c.legs[c.legs.length-1];
    return `<div class="wr ${W.sel===c?'on':''}" onclick="wySel(${i})">
      ${tag?`<div class="wr-tag">${tag}</div>`:''}
      <div class="wr-h"><b>${wyMin((p.arrive-p.now)/1000)}<small>분</small></b><i></i><span>${esc(wyClock(p.arrive))} 도착</span><i></i><span>환승 ${c.xfer}회</span></div>
      ${wyBar(c,p)}
      ${rows}
      <div class="wl"><div class="wl-k off">○ 하차</div><div class="wl-v"><b>${esc(lst.d.stops[lst.to].display)}</b>${c.tail&&c.tail.m?`<span class="wa wa-s">도보 ${c.tail.m}m</span>`:''}</div></div>
      <div class="wr-more">상세보기 ›</div></div>`;
  }).join('')||'<div class="wy-empty">이 조건에 맞는 경로가 없습니다.</div>';
  if(W.sel&&$('#wyR').classList.contains('on'))wyDetail();
}
/* 왼쪽 결과를 눌러야만 오른쪽 상세 창이 열림 */
function wySel(i){const c=(W.view||[])[i];if(!c)return;W.sel=c;W.open={};wyDetail();wyDraw();$('#wyR').classList.add('on');if(innerWidth<900)$('#wyR').scrollTop=0}
function wyCloseD(){W.sel=null;$('#wyR').classList.remove('on');wyDraw()}
function wyDetail(){
  const c=W.sel;if(!c)return;
  const p=wyPlan(c),o=W.o,d=W.d;
  let tl=`<div class="wt first"><div class="wt-t">${esc(wyClock(p.now))}</div><div class="wt-m wdash"><div class="wpin ws"><span>출발</span></div></div><div class="wt-c"><b>${esc(o.name)}</b><small>${esc(o.region)}</small></div></div>`;
  p.steps.forEach((s,j)=>{
    const l=s.l,rc=routeColor(l.r),arr=j===0?p.arr0:wyArr(l),mid=l.d.stops.slice(l.from+1,l.to),k='m'+j;
    const ends=`${l.d.stops[0].display} ↔ ${l.d.stops[l.d.stops.length-1].display}`;
    tl+=`<div class="wt" style="--lc:${rc}"><div class="wt-t">${esc(wyClock(s.st))}</div><div class="wt-m"><div class="wring"></div></div>
      <div class="wt-c"><b>${esc(l.d.stops[l.from].display)} 승차</b><small>${esc(l.d.stops[l.from].name)}</small>
        <div class="wbox">${arr.length?arr.map(a=>`<div class="wln"><span class="wno" style="background:${rc}">${esc(a.no)} ›</span><span class="wm">${a.m<=0?'곧 도착':a.m+'분'}</span> ${a.away?a.away+'정류장':'도착'}<span class="wdd">(${esc(l.r.no)}번 ${esc(ends)})</span></div>`).join('')
          :`<div class="wln"><span class="wno" style="background:${rc}">${esc(l.r.no)}</span> 지금 오는 버스 정보 없음<span class="wdd">(${esc(ends)})</span></div>`}
          <button class="wmore" onclick="wyRoute(${j})">버스 도착정보 더보기 ›</button></div>
        <div class="wmv" onclick="W.open['${k}']=!W.open['${k}'];wyDetail()">${l.to-l.from}개 정류장 이동 · 약 ${wyMin(l.sec)}분 ${W.open[k]?'⌃':'⌄'}</div>
        ${W.open[k]&&mid.length?`<div class="wmv-l">${mid.map(x=>'· '+esc(x.display)).join('<br>')}</div>`:''}
      </div></div>
      <div class="wt" style="--lc:${rc}"><div class="wt-t" style="align-self:center">${BUS_IC.replace('<svg','<svg style="width:15px;height:15px;color:'+rc+'"')}<br>${wyMin(l.sec)}분</div><div class="wt-m" style="min-height:0"></div><div></div></div>`;
    const w=c.walks[j],last=j===p.steps.length-1;
    tl+=`<div class="wt" style="--lc:${rc}"><div class="wt-t">${esc(wyClock(s.en))}</div><div class="wt-m ${last||w?'wdash':''}" style="--lc:${rc}"><div class="wring"></div></div>
      <div class="wt-c"><b>${esc(l.d.stops[l.to].display)} 하차</b><small>${esc(l.d.stops[l.to].name)}</small>
      ${w?`<div class="wmv">${w.m?'도보 '+w.m+'m · ':''}환승 약 ${wyMin(w.sec+60)}분</div>`:''}${last&&c.tail&&c.tail.m?`<div class="wmv">도보 ${c.tail.m}m · 약 ${wyMin(c.tail.sec)}분</div>`:''}</div></div>`;
  });
  tl+=`<div class="wt last"><div class="wt-t">${esc(wyClock(p.arrive))}</div><div class="wt-m wdash"><div class="wpin we"><span>도착</span></div></div><div class="wt-c"><b>${esc(d.name)}</b><small>${esc(d.region)}</small></div></div>`;
  $('#wyR').innerHTML=`<div class="wd-h"><button class="wd-x" onclick="wyCloseD()" aria-label="닫기">✕</button>
      <div class="wr-tag">${c.xfer?'환승 '+c.xfer+'회':'바로 가기'}</div>
      <div class="wr-h"><b>${wyMin((p.arrive-p.now)/1000)}<small>분</small></b><i></i><span>${esc(wyClock(p.arrive))} 도착</span></div>
      <div class="wd-sub">${[(()=>{const m=c.walks.reduce((a,w)=>a+(w.m||0),0)+(c.tail?c.tail.m:0);return m?`도보 ${m}m`:''})(),p.wait0?`대기 ${wyMin(p.wait0)}분`:''].filter(Boolean).join(' · ')}</div>
      ${wyBar(c,p)}</div>
    <div class="wtl">${tl}</div>`;
}
function wyRoute(j){const l=W.sel&&W.sel.legs[j];if(l)openRouteVia(W.o.gi,l.ri,l.k,'s-way')}
/* 길찾기·지도에서 노선도를 열 때: 뒤로 가면 그 화면으로 돌아오게 */
function openRouteVia(gi,ri,k,via){
  if(!DATA[gi]||!DATA[gi].routes[ri])return;
  st.live=false;st.rg=gi;$('#rgName').textContent=DATA[gi].name;
  st.rt=DATA[gi].routes[ri];
  stack.length=0;stack.push('s-region');if(via)stack.push(via);
  pickDir(Math.min(k||0,st.rt.dirs.length-1));
}

const REMOTE_MS=3000;    // 인터넷에서 열 때의 갱신 주기 (멀티플레이 위치가 3초마다 갱신)
let pollMs=REMOTE?REMOTE_MS:1000,fails=0;
async function loop(){
  if(!document.hidden){
    await pollLive();
    fails=ERR?fails+1:0;
    pollMs=curLive()&&curLive().static_snapshot?Math.max(10000,REMOTE_MS):(REMOTE?REMOTE_MS:1000);   // Netlify 스냅샷은 수십 초~수 분 간격으로만 바뀜
  }
  setTimeout(loop,ERR?Math.min(30000,pollMs*Math.pow(2,Math.min(fails,4))):pollMs);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollLive()});
drawAi();drawTabs();
loadRoutes().then(()=>{drawBanner();loop()});
</script>
</body>
